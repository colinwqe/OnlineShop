name: Deploy to GitHub Pages (push to gh-pages)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 如果你需要 build（例如 npm run build），在这里加 build 步骤并把 publish_dir 指向输出目录（例如 ./dist）
      # - name: Build site
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./    # 如果你的站点实际在 ./dist 或 ./public，改成对应目录
          # 可选：target_branch: gh-pages   # 默认是 gh-pages
