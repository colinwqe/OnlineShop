<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在线商城 - 仿京东首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container top-inner">
      <div class="logo">在线商城</div>
      <div class="search">
        <input id="searchInput" placeholder="搜索商品、品牌、店铺" />
        <button id="searchBtn">搜索</button>
      </div>
      <nav class="user-actions">
        <a href="/orders.html">我的订单</a>
        <a href="#">购物车</a>
        <a href="#">登录</a>
      </nav>
    </div>
  </header>

  <section class="hero container">
    <aside class="categories">
      <h3>全部分类</h3>
      <ul>
        <li>手机</li>
        <li>电脑</li>
        <li>家电</li>
        <li>服饰</li>
        <li>美妆</li>
        <li>母婴</li>
        <li>图书</li>
      </ul>
    </aside>

    <div class="main-area">
      <div class="carousel" id="carousel">
        <div class="slides">
          <img src="https://picsum.photos/900/300?random=101" alt="banner1">
          <img src="https://picsum.photos/900/300?random=102" alt="banner2">
          <img src="https://picsum.photos/900/300?random=103" alt="banner3">
        </div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="promotions">
        <div class="promo">促销1</div>
        <div class="promo">促销2</div>
        <div class="promo">促销3</div>
      </div>

      <section class="product-section">
        <h2>为你推荐</h2>
        <div class="product-grid" id="productGrid">
          <!-- product cards generated by JS -->
        </div>
      </section>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2026 在线商城 - 仿京东首页示例</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
